<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bero Bazart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-side header-side-left">
      <button class="hamburger-btn" id="hamburgerToggle" title="Menu" data-i18n-title="tip_menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="icon-btn" id="searchToggle" title="Rechercher" data-i18n-title="tip_search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>

    <a href="index.html" class="logo-word" aria-label="Bero Bazart"><img src="images/logo.png" alt="Bero Bazart" class="logo-img" onerror="this.parentNode.classList.add('no-logo');this.remove()" /><span class="logo-text">Bero Bazart</span></a>

    <div class="header-side header-side-right">
      <div class="lang-toggle">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="wishlistToggle" title="Liste d'envies" data-i18n-title="tip_wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.35-9.5-8.8C.8 7.9 2.6 4.5 6 4.5c2 0 3.4 1.1 4 2.3.6-1.2 2-2.3 4-2.3 3.4 0 5.2 3.4 3.5 6.7C19 15.65 12 20 12 20Z"/></svg>
        <span class="wishlist-count">0</span>
      </button>
      <button class="icon-btn" id="cartToggle" title="Panier" data-i18n-title="tip_cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count">0</span>
      </button>
    </div>
  </div>

  <div class="search-bar" id="searchBar">
    <div class="search-bar-inner">
      <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="Rechercher…" />
      <button id="searchClose" title="Fermer" data-i18n-title="tip_close">&times;</button>
    </div>
  </div>
</header>

<div id="mobileNavOverlay"></div>
<div id="mobileNavDrawer">
  <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
  <a href="index.html#shop" data-i18n="nav_shop">Boutique</a>
  <a href="index.html#new" data-i18n="section_new">Nouveautés</a>
</div>

<div id="pdpRoot"></div>

<footer class="site-footer">
  <div class="footer-bottom">
    <span>© <span id="year"></span> Bero Bazart</span>
  </div>
</footer>

<div id="cartOverlay"></div>
<div id="cartDrawer">
  <div class="cart-drawer-head">
    <h3 data-i18n="cart_title">Votre panier</h3>
    <button id="cartClose">&times;</button>
  </div>
  <div id="cartDrawerBody"></div>
  <div id="cartDrawerFooter" style="display:none">
    <div class="cart-total-row">
      <span data-i18n="cart_subtotal">Sous-total</span>
      <span id="cartSubtotal">0.00 DT</span>
    </div>
    <a href="checkout.html" class="btn btn-primary btn-block" data-i18n="cart_checkout">Passer la commande</a>
  </div>
</div>

<div id="wishlistOverlay"></div>
<div id="wishlistDrawer">
  <div class="cart-drawer-head">
    <h3 data-i18n="wishlist_title">Ma liste d'envies</h3>
    <button id="wishlistClose">&times;</button>
  </div>
  <div id="wishlistDrawerBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/product.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
