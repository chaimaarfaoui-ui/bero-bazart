<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bero Bazart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo sr-only">Bero Bazart</a>
    <nav class="main-nav">
      <a href="index.html#shop" data-i18n="nav_shop">Boutique</a>
      <a href="index.html#new" data-i18n="section_new">Nouveautés</a>
    </nav>
    <div class="header-actions">
      <div class="lang-toggle">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="cartToggle" title="Panier">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count">0</span>
      </button>
      <button class="hamburger-btn" id="hamburgerToggle" title="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="floating-logo">
  <a href="index.html"><img src="images/logo.png" alt="Bero Bazart" /></a>
</div>

<div id="mobileNavOverlay"></div>
<div id="mobileNavDrawer">
  <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
  <a href="index.html#shop" data-i18n="nav_shop">Boutique</a>
  <a href="index.html#new" data-i18n="section_new">Nouveautés</a>
</div>

<div id="pdpRoot"></div>

<footer class="site-footer">
  <div class="footer-bottom">
    <span>© <span id="year"></span> Bero Bazart</span>
  </div>
</footer>

<div id="cartOverlay"></div>
<div id="cartDrawer">
  <div class="cart-drawer-head">
    <h3 data-i18n="cart_title">Votre panier</h3>
    <button id="cartClose">&times;</button>
  </div>
  <div id="cartDrawerBody"></div>
  <div id="cartDrawerFooter" style="display:none">
    <div class="cart-total-row">
      <span data-i18n="cart_subtotal">Sous-total</span>
      <span id="cartSubtotal">0.00 DT</span>
    </div>
    <a href="checkout.html" class="btn btn-primary btn-block" data-i18n="cart_checkout">Passer la commande</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/product.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
